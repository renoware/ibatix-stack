./odoo:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    ocb: https://github.com/OCA/OCB.git
    odoo: https://github.com/odoo/odoo.git
  target: ocb $ODOO_VERSION
  merges:
    - ocb $ODOO_VERSION

./ibatix:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    ibatix: git@github.com:renoware/ibatix.git
  target: ibatix main
  merges:
    - ibatix main
