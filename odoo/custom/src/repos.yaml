# cache-bust 2026-10-12 oca-helpdesk
./odoo:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    ocb: https://github.com/OCA/OCB.git
    odoo: https://github.com/odoo/odoo.git
  target: ocb $ODOO_VERSION
  merges:
    - ocb $ODOO_VERSION

./ibatix:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    ibatix: git@github.com:renoware/ibatix.git
  target: ibatix main
  merges:
    - ibatix main

./oca-partner-contact:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    oca: https://github.com/OCA/partner-contact.git
  target: oca 19.0
  merges:
    - oca 19.0

./oca-server-auth:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    oca: https://github.com/OCA/server-auth.git
  target: oca 19.0
  merges:
    - oca 19.0

./muk-web:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    renoware: https://github.com/renoware/muk-web-19.git
  target: renoware 19.0
  merges:
    - renoware 19.0

./ibatix-seed-data:
  defaults:
    depth: $DEPTH_DEFAULT
  remotes:
    renoware: https://github.com/renoware/ibatix-seed-data.git
  target: renoware 19.0
  merges:
    - renoware 19.0

# Figé sur le commit installé sur PROD (vendor/ du monorepo, 04/10/2026) :
# la flotte ne passe jamais devant PROD.
./oca-helpdesk:
  defaults:
    depth: $DEPTH_DEFAULT
