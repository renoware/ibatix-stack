services:
  odoo:
    extends:
      file: common.yaml
      service: odoo
    restart: unless-stopped
    env_file:
      - .docker/odoo.env
      - .docker/db-access.env
    environment:
      DB_FILTER: "^prod$$"
      DOODBA_ENVIRONMENT: "prod"
      INITIAL_LANG: "fr_FR"
      LIST_DB: "false"
      ODOO_BUS_PUBLIC_SAMESITE_WS: 1
      PGHOST: ibatix-stack-prod-db
    depends_on:
      - db
    networks:
      default:
      inverseproxy_shared:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "inverseproxy_shared"
      traefik.http.routers.ibatix-app.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.ibatix-app.entrypoints: "websecure"
      traefik.http.routers.ibatix-app.tls.certresolver: "letsencrypt"
      traefik.http.routers.ibatix-app.service: "ibatix-app"
      traefik.http.services.ibatix-app.loadbalancer.server.port: "8069"
      # Racine du domaine -> l'espace de travail. Une instance client n'a
      # pas de site public : la page d'accueil du module `website` n'y montre
      # qu'un gabarit de demonstration. Un visiteur non connecte est envoye
      # sur la page de connexion, un utilisateur connecte directement dans
      # l'application. Seul le chemin exact « / » est concerne.
      traefik.http.routers.ibatix-root.rule: "Host(`${DOMAIN}`) && Path(`/`)"
      traefik.http.routers.ibatix-root.entrypoints: "websecure"
      traefik.http.routers.ibatix-root.tls.certresolver: "letsencrypt"
      traefik.http.routers.ibatix-root.priority: "200"
      traefik.http.routers.ibatix-root.service: "ibatix-app"
      traefik.http.routers.ibatix-root.middlewares: "ibatix-root-redir"
      traefik.http.middlewares.ibatix-root-redir.redirectregex.regex: "^https://([^/]+)/?$$"
      traefik.http.middlewares.ibatix-root-redir.redirectregex.replacement: "https://$${1}/odoo"
      traefik.http.middlewares.ibatix-root-redir.redirectregex.permanent: "false"

      # Gestion des bases : c'est exactement la porte par laquelle le HUB a
      # ete compromis le 17/09/2026 (base de test listee publiquement, puis
      # RCE). `list_db=false` ne suffit pas : /web/database/manager repond
      # quand meme. Seul le HUB peut desormais l'atteindre ; depuis un poste,
      # passer par un tunnel SSH.
      traefik.http.routers.ibatix-dbmgr.rule: "Host(`${DOMAIN}`) && PathPrefix(`/web/database`)"
      traefik.http.routers.ibatix-dbmgr.entrypoints: "websecure"
      traefik.http.routers.ibatix-dbmgr.tls.certresolver: "letsencrypt"
      traefik.http.routers.ibatix-dbmgr.priority: "100"
      traefik.http.routers.ibatix-dbmgr.service: "ibatix-app"
      traefik.http.routers.ibatix-dbmgr.middlewares: "ibatix-dbmgr-allow"
      traefik.http.middlewares.ibatix-dbmgr-allow.ipallowlist.sourcerange: "87.106.10.226/32"
      traefik.http.routers.ibatix-lp.rule: "Host(`${DOMAIN}`) && PathPrefix(`/longpolling`, `/websocket`)"
      traefik.http.routers.ibatix-lp.entrypoints: "websecure"
      traefik.http.routers.ibatix-lp.tls.certresolver: "letsencrypt"
      traefik.http.routers.ibatix-lp.service: "ibatix-lp"
      traefik.http.services.ibatix-lp.loadbalancer.server.port: "8072"

  db:
    extends:
      file: common.yaml
      service: db
    environment:
      DB_HOST: ibatix-stack-prod-db
    env_file:
      - .docker/db-creation.env
    restart: unless-stopped
    networks:
      default:
        aliases:
          - "ibatix-stack-prod-db"

networks:
  default:
    driver_opts:
      encrypted: 1

  inverseproxy_shared:
    external: true

volumes:
  filestore:
  db:
